name: Cross-version

# Runs the cross-Inno-version test matrix on Windows. On every push/PR, this
# installs the canonical matrix of Inno Setup versions (computed live from the
# jrsoftware/issrc GitHub releases, see test/support/inno_versions.dart) into
# the package's managed directory (`~/.inno_bundle/versions` — the same path
# `dart run inno_bundle` reads from), then runs `dart analyze`, `dart format`,
# and `dart test`.
# The matrix rule is: one entry per minor, the latest patch, no betas, floored
# at 6.4.0. If the live fetch fails, print_matrix.dart --fallback uses the
# pinned `fallbackMatrix` in test/support/inno_versions.dart.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  cross-version:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version

      - name: Resolve package deps
        run: dart pub get

      - name: Resolve demo_app deps
        working-directory: example/demo_app
        run: flutter pub get

      # Compute the canonical matrix live from GitHub, then reuse it for both
      # the install step and the cache key. print_matrix.dart handles the
      # fallback to the pinned matrix itself when the live fetch fails.
      - name: Compute Inno Setup version matrix
        id: matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $matrix = (& dart run tool/print_matrix.dart --fallback | Select-Object -Last 1).Trim()
          if ([string]::IsNullOrWhiteSpace($matrix)) {
            throw 'dart run tool/print_matrix.dart produced no output.'
          }
          Write-Host "Matrix: $matrix"
          "versions=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "cache-key=inno-versions-$($matrix -replace ',', '-')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Cache the package's real managed dir so subsequent runs skip the
      # (slow) Inno installer downloads/extractions. setup_versions installs
      # here by default; dart run inno_bundle reads from here by default.
      - name: Cache Inno Setup installs
        id: inno-cache
        uses: actions/cache@v6
        with:
          path: ~\.inno_bundle\versions
          key: ${{ steps.matrix.outputs.cache-key }}

      - name: Install Inno Setup matrix versions
        if: steps.inno-cache.outputs.cache-hit != 'true'
        run: dart run inno_bundle:setup_versions --versions ${{ steps.matrix.outputs.versions }}

      - name: Analyze
        run: dart analyze

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Set up MSVC dev environment
        uses: step-security/msvc-dev-cmd@v1

      - name: Test across all Inno versions
        run: dart test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}